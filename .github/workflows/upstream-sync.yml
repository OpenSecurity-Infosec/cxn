name: Upstream sync

# Keeps `upstream-main` an exact mirror of vercel-labs/fx `main` and proposes
# the periodic `upstream-main -> main` merge as a PR. Never pushes downstream
# merges directly to `main`; a human merges the sync PR.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward upstream-main to upstream/main
        id: ff
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/vercel-labs/fx.git 2>/dev/null || true
          git fetch upstream main origin upstream-main
          before=$(git rev-parse origin/upstream-main)
          after=$(git rev-parse upstream/main)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "upstream-main already exact."
          else
            # Non-force push: fails loudly if upstream-main ever diverges, which
            # should never happen (upstream-main takes no direct commits).
            git push origin upstream/main:upstream-main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update upstream-main -> main sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="${{ steps.ff.outputs.before }}"
          after="${{ steps.ff.outputs.after }}"
          range="$(git log --oneline "${before}..${after}" | head -n 50)"
          body="$(printf 'Upstream vercel-labs/fx advanced:\n\n`%s..%s`\n\n```\n%s\n```\n\nMerge checklist:\n- [ ] `zig build` + focused tests pass\n- [ ] patch-surface report within budget\n- [ ] conflicts resolved toward thin downstream hooks' "$before" "$after" "$range")"
          existing="$(gh pr list --base main --head upstream-main --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head upstream-main \
              --title "chore: sync upstream fx ${after:0:7}" --body "$body"
          else
            gh pr comment "$existing" --body "Upstream advanced to \`${after}\`."
          fi
